# Rockchip RK3399 hexa core HDMI TV box (KC2 / K10Plus), AP6354 WiFi, GbE
BOARD_NAME="KC2 / K10Plus"
BOARD_VENDOR="kc2"
BOARDFAMILY="rockchip64"
BOARD_MAINTAINER=""
INTRODUCED="2026"
# nanopc-t4 u-boot: its blobless mainline-TPL DDR timing is the ONLY chain
# proven to train RAM on this box (the nanopct4 reference image reaches
# u-boot video; firefly-rk3399 TPL timing does not - box stays dead)
BOOTCONFIG="nanopc-t4-rk3399_defconfig"
# mainline TPL/SPL/ATF, like nanopct4.csc - the vendor ddr blob v1.25 (2021)
# fails to train RAM on this box (no HDMI, no LED with only-blobs)
BOOT_SCENARIO="blobless"
KERNEL_TARGET="current,edge"
KERNEL_TEST_TARGET="current"
FULL_DESKTOP="yes"
BOOT_LOGO="desktop"
BOOT_FDT_FILE="rockchip/rk3399-kc2-k10plus.dtb"
SRC_EXTLINUX="yes"
SRC_CMDLINE="console=ttyS2,1500000 console=tty0 video=HDMI-A-1:1920x1080@60D"
# IR receiver keymap loader (Haigesen 3528 remote)
PACKAGE_LIST_BOARD="ir-keytable python3-evdev"
