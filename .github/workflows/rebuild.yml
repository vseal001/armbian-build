      board_override:
        description: "型号选 custom 时, 在这里填实际板卡名"
        required: false
        default: ""
        type: string
      desktop:
        description: "桌面版本 / desktop environment"
        required: true
        default: "xfce"
        type: choice
        options: [xfce, gnome, lxde, kde-plasma, none]
      branch:
        description: "内核分支 / kernel branch"
        required: true
        default: "current"
        type: choice
        options: [current, edge]
      release:
        description: "发行版 / userland release"
        required: true
        default: "trixie"
        type: choice
        options: [trixie, bookworm]
      sync_upstream:
        description: "先合并上游 armbian/build main 再构建 / sync upstream first"
        required: true
        default: false
        type: boolean
  schedule:
    - cron: "37 20 * * *"   # nightly, gated by NIGHTLY_ENABLED repo variable (default off)

permissions:
  contents: write

concurrency:
  group: rebuild-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    name: Rebuild Armbian image
    runs-on: ubuntu-22.04
    timeout-minutes: 360
    # nightly runs only pass this gate when the repo variable NIGHTLY_ENABLED=true
    if: github.event_name != 'schedule' || vars.NIGHTLY_ENABLED == 'true'
    env:
      IN_ARCH: ${{ inputs.arch }}
      IN_SOC: ${{ inputs.soc }}
      IN_BOARD: ${{ inputs.board }}
      IN_BOARD_OVERRIDE: ${{ inputs.board_override }}
      IN_DESKTOP: ${{ inputs.desktop }}
      IN_BRANCH: ${{ inputs.branch }}
      IN_RELEASE: ${{ inputs.release }}
      IN_SYNC_UPSTREAM: ${{ inputs.sync_upstream }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Resolve build parameters
        run: |
          # scheduled runs carry no inputs -> defaults: kc2-k10plus + xfce desktop
          BOARD="${IN_BOARD:-kc2-k10plus}"
          if [ "$BOARD" = "custom" ]; then
            BOARD="${IN_BOARD_OVERRIDE}"
            [ -n "$BOARD" ] || { echo "::error::board=custom needs board_override"; exit 1; }
          fi
          BRANCH="${IN_BRANCH:-current}"
          RELEASE="${IN_RELEASE:-trixie}"
          DESKTOP="${IN_DESKTOP:-xfce}"
          ARCH="${IN_ARCH:-arm64}"
          SOC="${IN_SOC:-rockchip64}"
          if [ "$DESKTOP" = "none" ]; then
            BUILD_DESKTOP="no"; DE=""
          else
            BUILD_DESKTOP="yes"; DE="$DESKTOP"
          fi
          # soft sanity checks (do not block the build)
          fam=$(grep -h "^BOARDFAMILY=" "config/boards/${BOARD}".* 2>/dev/null | head -1 | sed 's/^BOARDFAMILY="\([^"]*\)".*/\1/')
          [ -n "$fam" ] || { echo "::error::board $BOARD not found in config/boards"; exit 1; }
          [ "$fam" = "$SOC" ] || echo "::warning::selected SoC family '$SOC' != board family '$fam' (continuing)"
          [ "$ARCH" = "arm64" ] || echo "::warning::arch '$ARCH' selected - most rockchip64 boards are arm64 only"
          {
            echo "BOARD=$BOARD"
            echo "BRANCH=$BRANCH"
            echo "RELEASE=$RELEASE"
            echo "DESKTOP=$DESKTOP"
            echo "ARCH=$ARCH"
            echo "SOC=$SOC"
            echo "BUILD_DESKTOP=$BUILD_DESKTOP"
            echo "DE=$DE"
          } >> "$GITHUB_ENV"

      - name: Sync upstream armbian/build (nightly or on request)
        if: github.event_name == 'schedule' || env.IN_SYNC_UPSTREAM == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git remote add upstream https://github.com/armbian/build.git
          git fetch upstream main
          git merge --no-edit upstream/main
          if [ "${GITHUB_REF}" = "refs/heads/main" ]; then
            git push origin main
          else
            echo "::notice::merged upstream into $(git branch --show-current); push skipped (not on main)"
          fi

      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL || true
          df -h /

      - name: Build image
        run: |
          sudo -E ./compile.sh build \
            BOARD="$BOARD" \
            BRANCH="$BRANCH" \
            RELEASE="$RELEASE" \
            BUILD_DESKTOP="$BUILD_DESKTOP" \
            DESKTOP_ENVIRONMENT="$DE" \
            DESKTOP_TIER=mid \
            BUILD_MINIMAL=no \
            KERNEL_CONFIGURE=no \
            COMPRESS_OUTPUTIMAGE=sha,img

      - name: Upload images
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: armbian-${{ env.BOARD }}-${{ env.BRANCH }}-${{ env.RELEASE }}-${{ env.DESKTOP }}
          path: output/images/
          if-no-files-found: error

      - name: Upload build logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-logs-${{ github.run_number }}
          path: output/logs/
          if-no-files-found: ignore
