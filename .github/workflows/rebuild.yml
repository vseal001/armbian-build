name: rebuild

# KC2/K10Plus custom image builder for the vseal001/armbian-build fork.
#
# - Manual "web trigger": run from the Actions tab (workflow_dispatch).
# - Nightly build + upstream sync: OFF by default. Turn it on with the
#   repository variable NIGHTLY_ENABLED=true (Settings -> Secrets and
#   variables -> Actions -> Variables tab). Cron below is UTC 20:37 = 04:37 Beijing.
#
# Defaults build our kc2-k10plus board with the xfce desktop.

